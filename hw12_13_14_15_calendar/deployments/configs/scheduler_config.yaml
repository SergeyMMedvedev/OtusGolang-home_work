logger:
    level: "INFO"

broker:
  uri: "amqp://guest:guest@rabbitmq-service:5672/"

exchange:
  name: "calendar"
  type: "direct"
  durable: true
  auto_delete: false
  internal: false
  no_wait: false
  key: "scheduler"
  reliable: false

storage:
  type: "psql"

  psql:
    host: "postgres-service"
    port: 5432
    user: "otus_user"
    password: "otus_password"
    dbname: "calendar"
    sslmode: "disable"
    migrationDir: "/opt/calendar/migrations"
    execMigration: true